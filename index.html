<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR Ping Pong</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--fg:#f2f5ff;--ac:#ff5a5f;--ac2:#35d0ba;--card:rgba(15,20,40,.9)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#sc{font-size:26px;font-weight:800;text-shadow:0 2px 8px #000}
#info{font-size:12px;opacity:.85;text-shadow:0 1px 4px #000}
#msg{position:fixed;top:30%;left:0;right:0;text-align:center;font-size:34px;font-weight:800;color:#ffd166;text-shadow:0 3px 12px #000;pointer-events:none}
button{font:inherit;color:var(--fg);background:#1b2447;border:2px solid #2d3a6e;border-radius:12px;padding:10px 14px;cursor:pointer}
button.on{background:var(--ac2);color:#06231f;border-color:var(--ac2);font-weight:700}
#menuBtn{pointer-events:auto;padding:6px 10px;font-size:13px}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,20,.55)}
.card{background:var(--card);border-radius:18px;padding:22px;max-width:380px;width:calc(100% - 40px);text-align:center;box-shadow:0 10px 40px #000a}
h1{margin:0 0 6px;font-size:28px}.card p{margin:4px 0 12px;font-size:13px;opacity:.8;line-height:1.4}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-top:12px}
#go{background:var(--ac);border-color:var(--ac);font-weight:800;font-size:18px;width:100%;margin-top:14px;padding:13px}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div><div id="sc">0 – 0</div><div id="info"></div></div><button id="menuBtn" style="display:none">Menu</button></div>
<div id="msg"></div>
<div id="menu"><div class="card">
<h1 id="ttl">🏓 AR Ping Pong</h1>
<p id="sub">Swing your hand (or finger) to hit the ball back. First to 7 wins.</p>
<div class="lbl">Difficulty</div><div class="row" id="dRow"></div>
<div class="lbl">Controls</div><div class="row" id="mRow"></div>
<p id="mHint"></p>
<button id="go">Start</button>
</div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W,H;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
const D={Easy:{dur:2.2,min:1.3,sp:.8,hit:.88,err:.3,r:.32},Medium:{dur:1.7,min:1.0,sp:1.3,hit:.93,err:.18,r:.36},Hard:{dur:1.3,min:.75,sp:2.0,hit:.97,err:.08,r:.4},Insane:{dur:1.0,min:.55,sp:3.2,hit:.995,err:0,r:.45}};
const MODES={touch:['Touch / Mouse','Move your finger or mouse – the paddle follows it.'],motion:['Camera: Motion','Wave your hand in front of the camera – the paddle follows the movement.'],color:['Camera: Color','Tap an object (your hand, a colored item) in the camera view to track it.']};
let diff='Medium',mode='touch',best=0;
try{best=+localStorage.getItem('pp-best')||0}catch(e){}
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hz=()=>H*.3,hb=()=>H*.86;
function P(x,y,z){const s=.32+.68*z;return{x:W/2+x*s*W*.42,y:hz()+(hb()-hz())*z-y*s*H*.35,s}}
// menu
const dRow=$('dRow'),mRow=$('mRow');
function buildMenu(){dRow.innerHTML='';mRow.innerHTML='';
Object.keys(D).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.className=k===diff?'on':'';b.onclick=()=>{diff=k;buildMenu()};dRow.appendChild(b)});
Object.keys(MODES).forEach(k=>{const b=document.createElement('button');b.textContent=MODES[k][0];b.className=k===mode?'on':'';b.onclick=()=>{mode=k;buildMenu()};mRow.appendChild(b)});
$('mHint').textContent=MODES[mode][1]+(mode==='touch'?'':' Allow camera access when asked.')}
buildMenu();
// state
const st={me:0,cpu:0,streak:0,dur:1.7,phase:'menu'};
let shot=null,serveT=0,msgT=0,ctxA=null;
const pad={sx:.5,sy:.6,tx:.5,ty:.6,x:0,y:.3,vx:0,vy:0},cpu={x:0,y:.5,tx:0,ty:.5};
function say(t,s=1.1){$('msg').textContent=t;msgT=s}
function beep(f,d=.08,t='sine'){try{ctxA=ctxA||new (window.AudioContext||window.webkitAudioContext)();const o=ctxA.createOscillator(),g=ctxA.createGain();o.type=t;o.frequency.value=f;g.gain.value=.12;g.gain.exponentialRampToValueAtTime(.001,ctxA.currentTime+d);o.connect(g);g.connect(ctxA.destination);o.start();o.stop(ctxA.currentTime+d)}catch(e){}}
// camera tracking
const vid=document.createElement('video');vid.playsInline=true;vid.muted=true;
const sc=document.createElement('canvas');sc.width=80;sc.height=60;
const sx=sc.getContext('2d',{willReadFrequently:true});
let camOn=false,prev=null,trackCol=null,lastD=null;
async function startCam(){try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});vid.srcObject=s;await vid.play();camOn=true;return true}catch(e){return false}}
function track(){
if(!camOn||vid.readyState<2)return;
sx.save();sx.scale(-1,1);sx.drawImage(vid,-80,0,80,60);sx.restore();
const d=sx.getImageData(0,0,80,60).data;lastD=d;let n=0,mx=0,my=0;
if(mode==='motion'){const g=new Uint8Array(4800);for(let i=0;i<4800;i++)g[i]=(d[i*4]+d[i*4+1]+d[i*4+2])/3;
if(prev)for(let i=0;i<4800;i++)if(Math.abs(g[i]-prev[i])>30){n++;mx+=i%80;my+=(i/80)|0}
prev=g}
else if(mode==='color'&&trackCol){for(let i=0;i<4800;i++){const a=d[i*4]-trackCol[0],b=d[i*4+1]-trackCol[1],c=d[i*4+2]-trackCol[2];if(a*a+b*b+c*c<3600){n++;mx+=i%80;my+=(i/80)|0}}}
if(n>(mode==='motion'?15:8)){pad.tx=mx/n/80;pad.ty=my/n/60}}
cv.addEventListener('pointermove',e=>{if(mode==='touch'){pad.tx=e.clientX/W;pad.ty=e.clientY/H}});
cv.addEventListener('pointerdown',e=>{
if(mode==='touch'){pad.tx=e.clientX/W;pad.ty=e.clientY/H}
else if(mode==='color'&&lastD){const cx=clamp((e.clientX/W*80)|0,2,77),cy=clamp((e.clientY/H*60)|0,2,57);let r=0,g=0,b=0;for(let j=-2;j<=2;j++)for(let i=-2;i<=2;i++){const k=((cy+j)*80+cx+i)*4;r+=lastD[k];g+=lastD[k+1];b+=lastD[k+2]}trackCol=[r/25,g/25,b/25];say('Tracking!',.8)}});
// game flow
async function start(){
$('go').disabled=true;
if(mode!=='touch'&&!camOn){const ok=await startCam();if(!ok){mode='touch';buildMenu();alert('Camera isn’t available here, so touch/mouse control is on instead.')}}
$('go').disabled=false;
st.me=st.cpu=st.streak=0;st.dur=D[diff].dur;cpu.x=0;cpu.y=.5;shot=null;
$('menu').style.display='none';$('menuBtn').style.display='block';
st.phase='serving';serveT=1.5;say(mode==='color'&&!trackCol?'Tap to pick your paddle color':'Get ready!',1.4)}
$('go').onclick=start;
$('menuBtn').onclick=()=>{st.phase='menu';$('menu').style.display='flex';$('ttl').textContent='🏓 AR Ping Pong';$('sub').textContent='Paused. Pick settings and start a new match.';$('go').textContent='New match'};
function newShot(z0,z1,x0,y0,x1,y1,dur){shot={z0,z1,x0,y0,x1,y1,t:0,dur}}
function serve(){const o=D[diff];st.dur=Math.max(o.min,o.dur);newShot(0,1,cpu.x,cpu.y,rnd(-.8,.8),rnd(.25,.8),st.dur);shot.in=true;st.phase='play';beep(330)}
function bp(){if(!shot)return null;const p=Math.min(shot.t/shot.dur,1);return{p,x:shot.x0+(shot.x1-shot.x0)*p,y:shot.y0+(shot.y1-shot.y0)*p+.3*Math.sin(Math.PI*p),z:shot.z0+(shot.z1-shot.z0)*p}}
function point(me){
if(me)st.me++;else st.cpu++;
if(st.streak>best){best=st.streak;try{localStorage.setItem('pp-best',best)}catch(e){}}
beep(me?660:180,.25,me?'sine':'sawtooth');
if(st.me>=7||st.cpu>=7){st.phase='over';$('menu').style.display='flex';$('menuBtn').style.display='none';
$('ttl').textContent=st.me>st.cpu?'🏆 You win!':'CPU wins';$('sub').textContent='Final score '+st.me+' – '+st.cpu+' on '+diff+'.';$('go').textContent='Play again';return}
say(me?'Point for you!':'CPU scores',1.1);st.streak=0;st.phase='serving';serveT=1.6}
function update(dt){
const k=1-Math.pow(.0004,dt),ox=pad.sx,oy=pad.sy;
pad.sx+=(pad.tx-pad.sx)*k;pad.sy+=(pad.ty-pad.sy)*k;
pad.x=(pad.sx*W-W/2)/(W*.42);pad.y=(hb()-pad.sy*H)/(H*.35);
pad.vx=pad.vx*.6+((pad.sx-ox)*W/(W*.42)/dt)*.4;pad.vy=pad.vy*.6+(-(pad.sy-oy)*H/(H*.35)/dt)*.4;
const o=D[diff];
if(st.phase==='serving'){serveT-=dt;cpu.x+=(0-cpu.x)*dt*2;if(serveT<=0)serve()}
if(st.phase==='play'&&shot){
shot.t+=dt;const b=bp();
if(shot.in){
cpu.x+=(0-cpu.x)*dt*1.2;cpu.y+=(.5-cpu.y)*dt*1.2;
if(b.p>=.86&&Math.hypot(pad.x-b.x,pad.y-b.y)<.45){
const spd=Math.hypot(pad.vx,pad.vy);
st.streak++;st.dur=Math.max(o.min*.75,st.dur*.95*(1-Math.min(.2,spd*.03)));
const x1=clamp(pad.vx*.25+(b.x-pad.x)*2.2+rnd(-.2,.2),-.9,.9),y1=rnd(.25,.8);
newShot(1,0,b.x,b.y,x1,y1,st.dur);shot.in=false;
cpu.tx=x1+rnd(-1,1)*o.err;cpu.ty=y1+rnd(-1,1)*o.err;
say(spd>3?'SMASH!':st.streak>=5?st.streak+' rally!':'',.7);beep(520+Math.min(spd,4)*80,.07,'square')}
else if(b.p>=1){st.phase='pause';point(false)}}
else{
const dx=cpu.tx-cpu.x,dy=cpu.ty-cpu.y,dd=Math.hypot(dx,dy),m=Math.min(dd,o.sp*dt);
if(dd>0){cpu.x+=dx/dd*m;cpu.y+=dy/dd*m}
if(b.p>=1){
if(Math.hypot(cpu.x-b.x,cpu.y-b.y)<o.r&&Math.random()<o.hit){
st.dur=Math.max(o.min,st.dur*.97);
const away=Math.random()<(.3+(1-o.err)*.6);
const x1=away?-Math.sign(pad.x||1)*rnd(.4,.9):rnd(-.85,.85);
newShot(0,1,b.x,b.y,x1,rnd(.2,.85),st.dur);shot.in=true;beep(300,.07,'triangle')}
else{st.phase='pause';point(true)}}}}
}
// drawing
function paddle(x,y,z,col,r){const p=P(x,y,z),R=r*p.s*W*.42*.7;
ctx.strokeStyle='#d9b38c';ctx.lineWidth=R*.28;ctx.beginPath();ctx.moveTo(p.x,p.y+R*.8);ctx.lineTo(p.x,p.y+R*1.9);ctx.stroke();
ctx.fillStyle=col;ctx.beginPath();ctx.arc(p.x,p.y,R,0,7);ctx.fill();
ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,R*.8,0,7);ctx.stroke()}
function draw(){
ctx.clearRect(0,0,W,H);
if(camOn&&vid.readyState>=2){ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(vid,0,0,W,H);ctx.restore();ctx.fillStyle='rgba(5,10,25,.3)';ctx.fillRect(0,0,W,H)}
else{const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#10183a');g.addColorStop(1,'#050814');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
const a=P(-1,0,0),b=P(1,0,0),c=P(1,0,1),d=P(-1,0,1);
ctx.fillStyle='rgba(20,90,170,.6)';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.lineTo(d.x,d.y);ctx.closePath();ctx.fill();
ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=3;ctx.stroke();
const m1=P(0,0,0),m2=P(0,0,1);ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(m1.x,m1.y);ctx.lineTo(m2.x,m2.y);ctx.stroke();
const n1=P(-1.05,0,.5),n2=P(1.05,0,.5),nh=n1.s*H*.35*.22;
ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(n1.x,n1.y-nh,n2.x-n1.x,nh);ctx.lineWidth=2;ctx.strokeRect(n1.x,n1.y-nh,n2.x-n1.x,nh);
paddle(cpu.x,cpu.y,0,'#3b82f6',.4);
const bl=bp();
if(bl&&st.phase!=='menu'){const sh=P(bl.x,0,bl.z),bt=P(bl.x,bl.y,bl.z),r=Math.max(6,W*.032*bt.s);
ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(sh.x,sh.y,r,r*.35,0,0,7);ctx.fill();
const g=ctx.createRadialGradient(bt.x-r*.3,bt.y-r*.3,r*.1,bt.x,bt.y,r);g.addColorStop(0,'#fff');g.addColorStop(1,'#ff9f43');
ctx.fillStyle=g;ctx.beginPath();ctx.arc(bt.x,bt.y,r,0,7);ctx.fill()}
paddle(pad.x,pad.y,1,'#ef4444',.45);
}
let last=performance.now();
function loop(t){const dt=Math.min((t-last)/1000,.05)||.016;last=t;
track();if(st.phase==='serving'||st.phase==='play'||st.phase==='pause')update(dt);
else{pad.sx+=(pad.tx-pad.sx)*.3;pad.sy+=(pad.ty-pad.sy)*.3;pad.x=(pad.sx*W-W/2)/(W*.42);pad.y=(hb()-pad.sy*H)/(H*.35)}
if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').textContent=''}
$('sc').textContent='YOU '+st.me+' – '+st.cpu+' CPU';
$('info').textContent=diff+' · Rally '+st.streak+' · Best '+best;
draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
